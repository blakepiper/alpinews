Section "InputClass"
    Identifier "AlpineWS touchpad"
    MatchIsTouchpad "on"
    MatchDriver "libinput"
    Option "NaturalScrolling" "true"
    Option "Tapping" "true"
    Option "TappingButtonMap" "lrm"
    Option "ClickMethod" "clickfinger"
    Option "DisableWhileTyping" "true"
EndSection
Section "InputClass"
    Identifier "AlpineWS mice, excluding TrackPoint and tablets"
    MatchIsPointer "on"
    MatchIsTouchpad "off"
    MatchDriver "libinput"
    MatchTag "alpinews-mouse"
    Option "NaturalScrolling" "true"
EndSection
Section "InputClass"
    Identifier "AlpineWS US keyboard"
    MatchIsKeyboard "on"
    Option "XkbLayout" "us"
EndSection
Section "InputClass"
    Identifier "AlpineWS external Gaming Keyboard only"
    MatchIsKeyboard "on"
    MatchProduct "Gaming Keyboard"
    MatchUSBID "1fc9:e8c7"
    Option "XkbLayout" "us"
    Option "XkbOptions" "altwin:swap_alt_win"
EndSection
Section "ServerFlags"
    # A manually started X session must not expose its logged-in parent TTY
    # through VT switching or the X kill shortcut while the screen is locked.
    Option "DontVTSwitch" "true"
    Option "DontZap" "true"
EndSection
