name: Blix editor bootstrap

on:
  push:
    branches: [main, audit/install-20260920]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  editor:
    runs-on: ubuntu-latest
    container: alpine:3.24
    timeout-minutes: 15
    defaults:
      run:
        shell: sh -eu {0}
    steps:
      - name: Install the runtime manifest and run the real config-only installer
        run: |
          apk add --no-cache git curl ca-certificates
          adduser -D tester
          git init -q /home/tester/alpinews
          git -C /home/tester/alpinews fetch --depth=1 "https://github.com/${GITHUB_REPOSITORY}.git" "$GITHUB_SHA"
          git -C /home/tester/alpinews checkout -q --detach FETCH_HEAD
          set -- $(sed '/^[[:space:]]*#/d; /^[[:space:]]*$/d' /home/tester/alpinews/config/packages)
          apk add --no-cache "$@"
          chown -R tester:tester /home/tester
          su tester -c 'cd ~/alpinews; sh install.sh --config-only --replace-config'
      - name: Verify the retained compiler and target normalization
        run: |
          su tester -c '
            set -eu
            export PATH="$HOME/.local/bin:$PATH"
            sh "$HOME/alpinews/tests/compiler.sh"
            printf "int main(void) { return 0; }\n" > "$HOME/compiler-test.c"
            cc --target=x86_64-alpine-linux-musl "$HOME/compiler-test.c" -o "$HOME/compiler-test"
            "$HOME/compiler-test"
            tree-sitter --version
          '
      - name: Run the actual installer language-server bootstrap twice
        run: |
          su tester -c '
            set -eu
            ROOT=$HOME/alpinews
            STATE=$HOME/.local/state/alpinews
            WORK=$(mktemp -d)
            trap '\''rm -rf "$WORK"'\'' EXIT
            export ROOT STATE WORK
            . "$ROOT/lib/common.sh"
            . "$ROOT/lib/editor.sh"
            prepare_editor
            prepare_editor
          '
      - name: Bootstrap Blix plugins and finish all configured parser builds
        id: bootstrap
        run: |
          # Lazy restore does not wait for asynchronous Tree-sitter installs.
          # Keep this Neovim process alive until every configured parser loads.
          su tester -c 'export PATH="$HOME/.local/bin:$PATH"; timeout 480 nvim --headless "+Lazy! restore" "+lua dofile(vim.env.HOME .. \"/alpinews/tests/editor-integration.lua\")"' > /home/tester/editor-bootstrap.log 2>&1
          if grep -E 'Error (detected|in)|E[0-9]{3,}:|Failed to run.*config|No C compiler found|Failed to build|Failed to load' /home/tester/editor-bootstrap.log; then
            exit 1
          fi
      - name: Install and execute the actual Mason tools
        run: |
          su tester -c 'export PATH="$HOME/.local/bin:$PATH"; timeout 180 nvim --headless "+lua require(\"lazy\").load({plugins={\"mason.nvim\"}})" "+MasonInstall stylua shfmt" "+qa!"' > /home/tester/editor-tools.log 2>&1
          su tester -c '
            set -eu
            "$HOME/.local/share/nvim/mason/bin/lua-language-server" --version
            "$HOME/.local/share/nvim/mason/bin/stylua" --version
            "$HOME/.local/share/nvim/mason/bin/shfmt" --version
          '
      - name: Verify parser loading on a second editor start
        if: ${{ !cancelled() && steps.bootstrap.outcome == 'success' }}
        run: |
          su tester -c 'export PATH="$HOME/.local/bin:$PATH"; timeout 90 nvim --headless "+lua dofile(vim.env.HOME .. \"/alpinews/tests/editor-integration.lua\")"' > /home/tester/editor-parsers.log 2>&1
      - name: Print editor diagnostics
        if: always()
        run: |
          for f in /home/tester/editor-bootstrap.log /home/tester/editor-tools.log /home/tester/editor-parsers.log /home/tester/.local/state/alpinews/editor-tools.log /home/tester/.local/state/nvim/mason.log; do
            if [ -f "$f" ]; then printf '\n--- %s ---\n' "$f"; tail -n 100 "$f"; fi
          done
