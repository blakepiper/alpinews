name: Blix editor bootstrap

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  editor:
    runs-on: ubuntu-latest
    container: alpine:3.24
    timeout-minutes: 10
    defaults:
      run:
        shell: sh -eu {0}
    steps:
      - name: Install the runtime manifest and run the real config-only installer
        run: |
          apk add --no-cache git curl ca-certificates
          adduser -D tester
          git init -q /home/tester/alpinews
          git -C /home/tester/alpinews fetch --depth=1 "https://github.com/${GITHUB_REPOSITORY}.git" "$GITHUB_SHA"
          git -C /home/tester/alpinews checkout -q --detach FETCH_HEAD
          set -- $(sed '/^[[:space:]]*#/d; /^[[:space:]]*$/d' /home/tester/alpinews/config/packages)
          apk add --no-cache "$@"
          chown -R tester:tester /home/tester
          su tester -c 'cd ~/alpinews; sh install.sh --config-only --replace-config'
      - name: Verify the retained compiler works
        run: |
          su tester -c '
            set -eu
            export PATH="$HOME/.local/bin:$PATH"
            printf "int main(void) { return 0; }\n" > "$HOME/compiler-test.c"
            cc "$HOME/compiler-test.c" -o "$HOME/compiler-test"
            "$HOME/compiler-test"
            tree-sitter --version
          '
      - name: Bootstrap the unmodified Blix plugins
        run: |
          su tester -c 'export PATH="$HOME/.local/bin:$PATH"; timeout 240 nvim --headless "+Lazy! restore" "+lua if vim.v.errmsg ~= string.char() then io.stderr:write(vim.v.errmsg); vim.cmd.cquit(1) end" "+qa!"' > /home/tester/editor-bootstrap.log 2>&1
          if grep -E 'Error (detected|in)|E[0-9]{3,}:|Failed to run.*config|No C compiler found|Failed to build|Failed to load' /home/tester/editor-bootstrap.log; then
            exit 1
          fi
      - name: Install and execute the actual Mason tools
        run: |
          su tester -c 'export PATH="$HOME/.local/bin:$PATH"; timeout 180 nvim --headless "+lua require(\"lazy\").load({plugins={\"mason.nvim\"}})" "+MasonInstall lua-language-server stylua shfmt" "+qa!"' > /home/tester/editor-tools.log 2>&1
          su tester -c '
            set -eu
            "$HOME/.local/share/nvim/mason/bin/lua-language-server" --version
            "$HOME/.local/share/nvim/mason/bin/stylua" --version
            "$HOME/.local/share/nvim/mason/bin/shfmt" --version
          '
      - name: Exercise the unmodified parser configuration
        run: |
          su tester -c 'export PATH="$HOME/.local/bin:$PATH"; timeout 210 nvim --headless "+lua dofile(vim.env.HOME .. \"/alpinews/tests/editor-integration.lua\")"' > /home/tester/editor-parsers.log 2>&1
      - name: Print editor diagnostics
        if: always()
        run: |
          for f in /home/tester/editor-bootstrap.log /home/tester/editor-tools.log /home/tester/editor-parsers.log /home/tester/.local/state/nvim/mason.log; do
            if [ -f "$f" ]; then printf '\n--- %s ---\n' "$f"; tail -n 100 "$f"; fi
          done
